name: Validate THE SYSTEM

on:
  push:
    branches:
      - feature/identity-quest-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install chromium
      - name: Test multi-objective quest player flow
        run: npm run test:browser:objectives
      - name: Build production bundle
        run: npm run build
